train:
  speculator_type: mtp
  deterministic_algorithms: true
  verifier:
    verifier_name_or_path: /data1/weight/GLM-5.3-w4a8-spec
    trust_remote_code: true
  draft:
    from_pretrained: /data1/mtp_training/weights/glm53_mtp_speculators_step0
  data:
    data_path: /data1/mtp_training/data/prepared_8k_dflash2_official
    hidden_states_backend: file
    total_seq_len: 8192
    max_val_batches: 1
    train_data_ratio: 0.9005663797009515
    hidden_states_dtype: bfloat16
    num_workers: 0
    prefetch_factor: 1
    max_transfer_workers: 1
  generation:
    vllm_endpoint: http://127.0.0.1:8000/v1
    on_missing: generate
    request_timeout: 600.0
    max_retries: 2
    generation_validation_retries: 2
    max_consecutive_generation_failures: 20
  optimizer:
    optimizer: adamw
    optimizer_implementation: eager
    lr: 1.0e-05
    weight_decay: 0.1
  scheduler:
    scheduler_type: cosine
    scheduler_warmup_steps: 1
    scheduler_total_steps: 100
  trainer:
    epochs: 1
    checkpoint_freq: 20.0
    save_best: true
    log_freq: 1
    save_path: /data1/mtp_training/runs/glm53_mtp_formal100_8k/checkpoints
    fsdp_shard: true
    max_steps: 100
  logging:
    logger: ''
    log_dir: /data1/mtp_training/runs/glm53_mtp_formal100_8k/logs
    run_name: glm53_mtp_formal100_8k
  mtp:
    num_speculative_steps: 1
  backend:
    hidden_states_path: /data1/mtp_training/online_hidden_states_formal100_8k
    hidden_states_lock_timeout: 180.0
